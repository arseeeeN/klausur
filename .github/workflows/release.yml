name: Release

# Push a tag `vX.Y.Z` matching Cargo.toml's version (see dev/releasing.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          # ring compiles C; Ubuntu's musl-tools only provides `musl-gcc`.
          target="${{ matrix.target }}"
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/klausur.exe" "dist/klausur-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/klausur" "dist/klausur-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klausur-${{ matrix.target }}
          path: dist/*

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum klausur-* > SHA256SUMS
      - name: Add install scripts
        run: cp install/install.sh install/install.ps1 dist/
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
