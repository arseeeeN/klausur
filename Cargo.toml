[package]
name = "klausur"
version = "0.3.0"
edition = "2024"
description = "Send API requests and run API tests, written in a small scripting language"
license = "MIT"
repository = "https://github.com/arseeeeN/klausur"
readme = "README.md"
keywords = ["api", "http", "testing", "rhai"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
cssparser = "0.37"
csv = "1"
ctrlc = "3"
dotenvy = "0.15"
dunce = "1"
miette = { version = "7.6", features = ["fancy"] }
notify = "8"
percent-encoding = "2"
regex = "1"
rhai = { version = "1.26", features = ["internals", "serde"] }
roxmltree = "0.21.1"
scraper = "0.27.0"
selectors = "0.38"
self-replace = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_json_path = "0.7.2"
sha2 = "0.10"
strsim = "0.11"
tungstenite = "0.29"
ureq = "3"

[dev-dependencies]
tiny_http = "0.12"
