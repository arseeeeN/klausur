[package]
name = "klausur"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cssparser = "0.37"
csv = "1"
ctrlc = "3"
dotenvy = "0.15"
miette = { version = "7.6", features = ["fancy"] }
percent-encoding = "2"
regex = "1"
rhai = { version = "1.26", features = ["internals", "serde"] }
roxmltree = "0.21.1"
scraper = "0.27.0"
selectors = "0.38"
serde_json = { version = "1", features = ["preserve_order"] }
serde_json_path = "0.7.2"
strsim = "0.11"
ureq = "3"

[dev-dependencies]
tiny_http = "0.12"
